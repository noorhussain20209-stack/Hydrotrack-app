name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # Generate the full Flutter project skeleton (android/, ios/, etc.)
      # in a fresh folder, since we only keep the app's own code in this repo.
      - name: Scaffold Flutter project
        run: flutter create --platforms=android scaffold

      # Drop our actual app code into the freshly scaffolded project,
      # overwriting the placeholder files it generated.
      - name: Copy app code into scaffold
        run: |
          cp pubspec.yaml scaffold/pubspec.yaml
          cp lib/main.dart scaffold/lib/main.dart

      - name: Fix Kotlin version placeholder bug
        run: |
          sed -i "s/<latest-version>/1.9.22/" scaffold/android/build.gradle 2>/dev/null || true
          sed -i "s/<latest-version>/1.9.22/" scaffold/android/settings.gradle 2>/dev/null || true

      - name: Get dependencies
        working-directory: scaffold
        run: flutter pub get

      - name: Build APK
        working-directory: scaffold
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: hydrotrack-release-apk
          path: scaffold/build/app/outputs/flutter-apk/app-release.apk
